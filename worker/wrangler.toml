name = "stardy-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "stardy"
database_id = "REPLACE_AFTER_CREATING"  # set after `wrangler d1 create stardy`

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://stardy.pages.dev"

# Preview deploys
[env.preview]
[env.preview.vars]
ENVIRONMENT = "preview"
ALLOWED_ORIGIN = "*"
