name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============== 1) MOBILE WEB BUILD & DEPLOY ==============
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install & build
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npm run build:web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

      - name: Deploy to Cloudflare Pages (PR preview)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy mobile/dist --project-name=stardy --branch=preview-${{ github.event.pull_request.number }} --commit-dirty=true

      - name: Deploy to Cloudflare Pages (main → prod)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy mobile/dist --project-name=stardy --branch=main --commit-dirty=true

  # ============== 2) WORKER API DEPLOY ==============
  worker:
    runs-on: ubuntu-latest
    needs: mobile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Apply D1 migrations (remote)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply stardy --remote

      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

  # ============== 3) TENCENT CLOUDBASE 镜像 ==============
  mirror:
    runs-on: ubuntu-latest
    needs: mobile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Build web
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npm run build:web

      - name: Deploy to 腾讯云 CloudBase
        working-directory: mobile/dist
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          npx --yes @cloudbase/cli@latest hosting deploy . -e $TCB_ENV_ID
