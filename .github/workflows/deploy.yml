name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============== 1) MOBILE WEB → CLOUDFLARE PAGES ==============
  # 用官方 Pages Action（更稳，错误信息友好），不再走 wrangler-action
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install & build
        working-directory: mobile
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run build:web

      - name: Verify build output
        working-directory: mobile
        run: |
          ls -la dist/
          test -f dist/index.html && echo "✓ index.html present"
          test -d dist/_expo/static && echo "✓ _expo/static present"

      - name: Ensure Pages project exists (idempotent)
        working-directory: mobile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          npx -y wrangler@latest pages project create stardy \
            --production-branch=main 2>&1 | tee /tmp/pages-create.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ $rc -eq 0 ]; then
            echo "✓ Pages project stardy created"
          elif grep -qE "already exists|project with this name" /tmp/pages-create.log; then
            echo "✓ Pages project stardy already exists"
          else
            echo "✗ pages project create failed (rc=$rc):"
            cat /tmp/pages-create.log
            exit 1
          fi

      - name: Deploy (PR preview)
        if: github.event_name == 'pull_request'
        uses: cloudflare/pages-action@v1
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          projectName: stardy
          directory: mobile/dist
          branch: preview-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy (main → prod)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/pages-action@v1
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          projectName: stardy
          directory: mobile/dist
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ============== 2) WORKER API → CLOUDFLARE WORKERS ==============
  worker:
    runs-on: ubuntu-latest
    needs: mobile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        working-directory: worker
        run: npm ci || npm install --no-audit --no-fund

      - name: Apply D1 migrations (remote)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply stardy --remote

      - name: Deploy worker
        working-directory: worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

  # ============== 3) TENCENT CLOUDBASE 镜像（可选） ==============
  mirror:
    runs-on: ubuntu-latest
    needs: mobile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Build web
        working-directory: mobile
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run build:web

      - name: Deploy to 腾讯云 CloudBase
        working-directory: mobile/dist
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          npx --yes @cloudbase/cli@latest hosting deploy . -e $TCB_ENV_ID
