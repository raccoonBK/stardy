name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Build mobile web (re-usable artifact)
  # ============================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install & build
        working-directory: mobile
        env:
          # Optional: bake the function URL into the web bundle. Set as GH
          # Secret `TCB_API_URL` after the first function deploy. If unset,
          # the SPA uses same-origin `/api/*` (works if you proxy at hosting).
          EXPO_PUBLIC_API_BASE: ${{ secrets.TCB_API_URL }}
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run build:web

      - name: Verify build output
        working-directory: mobile
        run: |
          ls -la dist/
          test -f dist/index.html && echo "✓ index.html present"
          test -d dist/_expo/static && echo "✓ _expo/static present"

      - name: Upload mobile/dist
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dist
          path: mobile/dist/
          retention-days: 7

  # ============================================================
  # 2. Deploy CloudBase HTTP 云函数 (api)
  # ============================================================
  function:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/api/package-lock.json

      - name: Install function deps
        working-directory: functions/api
        run: npm install --omit=dev --no-audit --no-fund --prefer-offline

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@latest

      - name: Login (api key)
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: |
          tcb login --apiKeyId "$TENCENTCLOUD_SECRETID" --apiKey "$TENCENTCLOUD_SECRETKEY"

      - name: Deploy HTTP function `api`
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_ALLOW_ORIGIN: ${{ secrets.TCB_ALLOW_ORIGIN }}
        run: |
          cd functions
          tcb fn deploy api --httpFn --force
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ function api deployed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Function URL (triggers):"
          tcb fn detail api --env-id "$TCB_ENV_ID" 2>&1 | sed -n '/trigger\|Trigger\|servicePath\|InvokeUrl/p' | head -20 || true
          echo ""
          echo "Next: 抓到这里显示的 URL，设到 GH Secret TCB_API_URL，下次 build 就把"
          echo "它 bake 进 mobile bundle。同源 + 跨域都能用。"

  # ============================================================
  # 3. Deploy static hosting 静态托管
  # ============================================================
  hosting:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@latest

      - name: Login
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: |
          tcb login --apiKeyId "$TENCENTCLOUD_SECRETID" --apiKey "$TENCENTCLOUD_SECRETKEY"

      - name: Download mobile/dist artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile-dist
          path: mobile/dist

      - name: Deploy to CloudBase 静态托管
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          tcb hosting deploy mobile/dist --env-id "$TCB_ENV_ID" --yes
          echo ""
          echo "✓ hosting deployed"
          echo "URL: https://${TCB_ENV_ID}.tcbapp.cn"
          tcb hosting detail --env-id "$TCB_ENV_ID" 2>&1 | tail -20 || true

  # ============================================================
  # 4. PR preview — builds but does NOT deploy
  # ============================================================
  preview:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Comment preview info on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            📦 Mobile web build succeeded for PR ${{ github.event.pull_request.number }}.
            Artifact `mobile-dist` is available in the workflow run.

            腾讯云 CloudBase 预览暂未启用（避免污染 prod 数据）。
            本地预览：
            ```bash
            cd mobile
            npm install
            npm run web   # http://localhost:8081
            ```
