name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Build mobile web (re-usable artifact)
  # ============================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install & build
        working-directory: mobile
        env:
          # CloudBase HTTP functions use the environment service domain.
          # A secret can override it for a custom domain or another gateway.
          EXPO_PUBLIC_API_BASE: ${{ secrets.TCB_API_URL || 'https://pengbi-d9g6dq0tobf99cd63.service.tcloudbase.com' }}
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run build:web

      - name: Verify build output
        working-directory: mobile
        run: |
          ls -la dist/
          test -f dist/index.html && echo "✓ index.html present"
          test -d dist/_expo/static && echo "✓ _expo/static present"

      - name: Upload mobile/dist
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dist
          path: mobile/dist/
          retention-days: 7

  # ============================================================
  # 2. Deploy CloudBase HTTP 云函数 (api)
  # ============================================================
  function:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/api/package-lock.json

      - name: Install function deps
        working-directory: functions/api
        run: npm install --omit=dev --no-audit --no-fund --prefer-offline

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@latest

      - name: Login (api key)
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: |
          test -n "$TENCENTCLOUD_SECRETID" || { echo "::error::Missing GitHub Secret TENCENTCLOUD_SECRETID"; exit 1; }
          test -n "$TENCENTCLOUD_SECRETKEY" || { echo "::error::Missing GitHub Secret TENCENTCLOUD_SECRETKEY"; exit 1; }
          tcb login --apiKeyId "$TENCENTCLOUD_SECRETID" --apiKey "$TENCENTCLOUD_SECRETKEY"

      - name: Deploy HTTP function `api`
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          tcb fn deploy api --httpFn --force -e "$TCB_ENV_ID"
          API_DOMAIN="${TCB_ENV_ID}.service.tcloudbase.com"
          ROUTE_JSON=$(tcb routes list -e "$TCB_ENV_ID" --filter "Domain=${API_DOMAIN}" --json)
          if printf '%s' "$ROUTE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if any(r.get("path")=="/api" and r.get("upstreamResourceName")=="api" for r in d.get("data",[])) else 1)'; then
            printf 'Y\n' | tcb routes edit -e "$TCB_ENV_ID" --data "{\"domain\":\"$API_DOMAIN\",\"routes\":[{\"path\":\"/api\",\"upstreamResourceType\":\"WEB_SCF\",\"upstreamResourceName\":\"api\",\"enable\":true,\"enableAuth\":false,\"enablePathTransmission\":true}]}" --json
          else
            printf 'Y\n' | tcb routes add -e "$TCB_ENV_ID" --data "{\"domain\":\"$API_DOMAIN\",\"routes\":[{\"path\":\"/api\",\"upstreamResourceType\":\"WEB_SCF\",\"upstreamResourceName\":\"api\",\"enable\":true,\"enableAuth\":false,\"enablePathTransmission\":true}]}" --json
          fi
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ function api deployed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Function URL (triggers):"
          tcb fn detail api -e "$TCB_ENV_ID" 2>&1 | sed -n '/trigger\|Trigger\|servicePath\|InvokeUrl/p' | head -20 || true
          echo ""
          echo "API URL: https://${TCB_ENV_ID}.service.tcloudbase.com"

  # ============================================================
  # 3. Deploy static hosting 静态托管
  # ============================================================
  hosting:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@latest

      - name: Login
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: |
          test -n "$TENCENTCLOUD_SECRETID" || { echo "::error::Missing GitHub Secret TENCENTCLOUD_SECRETID"; exit 1; }
          test -n "$TENCENTCLOUD_SECRETKEY" || { echo "::error::Missing GitHub Secret TENCENTCLOUD_SECRETKEY"; exit 1; }
          tcb login --apiKeyId "$TENCENTCLOUD_SECRETID" --apiKey "$TENCENTCLOUD_SECRETKEY"

      - name: Download mobile/dist artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile-dist
          path: mobile/dist

      - name: Deploy to CloudBase 静态托管
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          tcb hosting deploy mobile/dist --env-id "$TCB_ENV_ID"
          echo ""
          echo "✓ hosting deployed"
          tcb hosting detail --env-id "$TCB_ENV_ID" --json

  # ============================================================
  # 4. PR preview — builds but does NOT deploy
  # ============================================================
  preview:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Comment preview info on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            📦 Mobile web build succeeded for PR ${{ github.event.pull_request.number }}.
            Artifact `mobile-dist` is available in the workflow run.

            腾讯云 CloudBase 预览暂未启用（避免污染 prod 数据）。
            本地预览：
            ```bash
            cd mobile
            npm install
            npm run web   # http://localhost:8081
            ```
