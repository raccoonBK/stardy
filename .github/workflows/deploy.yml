name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  TCB_REGION: ap-shanghai

jobs:
  # ============================================================
  # 1. Build mobile web
  # ============================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install & build
        working-directory: mobile
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run build:web

      - name: Verify build output
        working-directory: mobile
        run: |
          ls -la dist/
          test -f dist/index.html && echo "✓ index.html present"
          test -d dist/_expo/static && echo "✓ _expo/static present"

      - name: Upload mobile/dist
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dist
          path: mobile/dist/
          retention-days: 7

  # ============================================================
  # 2. Deploy CloudBase HTTP 云函数 (api)
  #    - PR: deploy to a PR-scoped env or skip (skipping for now;
  #          functions need real envId; PR preview skipped for backend)
  #    - main: deploy to production env
  # ============================================================
  function:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/api/package-lock.json

      - name: Install function deps (offline-friendly)
        working-directory: functions/api
        run: npm install --omit=dev --no-audit --no-fund --prefer-offline

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@latest

      - name: Login (device-code via secret refresh token)
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: |
          tcb login --apiKeyId "$TENCENTCLOUD_SECRETID" --apiKey "$TENCENTCLOUD_SECRETKEY"

      - name: Deploy HTTP function `api`
        working-directory: functions
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_ALLOW_ORIGIN: ${{ secrets.TCB_ALLOW_ORIGIN }}
        run: |
          tcb fn deploy api --httpFn --force
          echo "✓ function api deployed"

  # ============================================================
  # 3. Deploy static hosting 静态托管
  #    PR: deploy to a temp env-scoped sub-path (still uses prod env;
  #        user can route via custom domain or sub-path). For MVP we
  #        skip PR preview for hosting to avoid stomping prod data.
  #    main: deploy mobile/dist to root
  # ============================================================
  hosting:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@latest

      - name: Login
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: |
          tcb login --apiKeyId "$TENCENTCLOUD_SECRETID" --apiKey "$TENCENTCLOUD_SECRETKEY"

      - name: Download mobile/dist artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile-dist
          path: mobile/dist

      - name: Deploy to CloudBase 静态托管
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          tcb hosting deploy mobile/dist --env-id "$TCB_ENV_ID" --yes
          tcb hosting detail --env-id "$TCB_ENV_ID"

  # ============================================================
  # 4. (Optional) PR preview
  #    Builds the web artifact but does NOT deploy. Comment on the PR
  #    with a "preview" message and skip destructive deploys.
  # ============================================================
  preview:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            📦 Mobile web build succeeded for PR ${{ github.event.pull_request.number }}.
            Artifact `mobile-dist` is available in the workflow run.

            腾讯云 CloudBase 预览暂未启用（避免污染 prod 数据）。
            本地预览：
            ```bash
            cd mobile
            npm run web   # http://localhost:8081
            ```
